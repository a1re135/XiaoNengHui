<script>
        // Simple script to handle filter tab active state visually
        document.querySelectorAll('nav.overflow-x-auto button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active classes from all tabs
                document.querySelectorAll('nav.overflow-x-auto button').forEach(btn => {
                    btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                    btn.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                });
                
                // Add active classes to clicked tab
                this.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                this.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
            });
        });
