<body class="bg-background text-on-background min-h-screen pb-24 font-body-md">
<!-- TopAppBar -->
<header class="bg-surface text-primary flex justify-between items-center w-full px-margin-mobile h-14 z-50 sticky top-0 bg-surface-container-low">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="school">school</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">校能汇 SkillHub</h1>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile py-6 max-w-md mx-auto w-full flex flex-col gap-stack-lg">
<!-- Header Section -->
<section class="mb-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-1">发布任务</h2>
<p class="font-body-md text-body-md text-on-surface-variant">填写任务信息，让校内同学快速接单</p>
</section>
<!-- Form Section -->
<form class="flex flex-col bg-surface-container-lowest p-5 rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-surface-container-high">
<!-- Task Title -->
<div class="form-input-container mt-2">
<label class="form-label font-label-md text-label-md text-on-surface-variant">任务标题</label>
<input class="form-input font-body-md text-body-md text-on-surface placeholder:text-[#94A3B8]" placeholder="例如：高等数学期末复习辅导" type="text"/>
</div>
<!-- Task Type Chips -->
<div class="mb-6">
<label class="block font-label-lg text-label-lg text-on-surface mb-3">任务类型</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-[#F1F5F9] text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" type="button">技能辅导</button>
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-md transition-colors" type="button">创意服务</button>
<button class="px-4 py-2 rounded-full bg-[#F1F5F9] text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" type="button">校园跑腿</button>
<button class="px-4 py-2 rounded-full bg-[#F1F5F9] text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" type="button">资料打印</button>
<button class="px-4 py-2 rounded-full bg-[#F1F5F9] text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors" type="button">其他</button>
</div>
</div>
<!-- Budget & Location -->
<div class="flex gap-4 mb-6">
<div class="form-input-container flex-1 mb-0">
<label class="form-label font-label-md text-label-md text-on-surface-variant">预算金额</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-lg text-body-lg">¥</span>
<input class="form-input pl-8 font-body-md text-body-md text-on-surface placeholder:text-[#94A3B8]" placeholder="0.00" type="number"/>
</div>
</div>
<div class="form-input-container flex-1 mb-0">
<label class="form-label font-label-md text-label-md text-on-surface-variant">任务地点</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
<input class="form-input pl-10 font-body-md text-body-md text-on-surface placeholder:text-[#94A3B8]" placeholder="例如：一教302" type="text"/>
</div>
</div>
</div>
<!-- Completion Time -->
<div class="form-input-container">
<label class="form-label font-label-md text-label-md text-on-surface-variant">期望完成时间</label>
<div class="relative">
<input class="form-input font-body-md text-body-md text-on-surface bg-transparent appearance-none" type="datetime-local"/>
</div>
</div>
<!-- Description -->
<div class="form-input-container !mb-4">
<label class="form-label font-label-md text-label-md text-on-surface-variant">任务描述</label>
<textarea class="form-input font-body-md text-body-md text-on-surface placeholder:text-[#94A3B8] resize-none" placeholder="详细说明任务要求，如时间、地点、具体内容等..." rows="4"></textarea>
</div>
</form>
<!-- Bottom Actions & Info -->
<div class="flex flex-col gap-4 mt-2 mb-8">
<!-- Info Box -->
<div class="bg-surface-container-low rounded-lg p-4 flex gap-3 items-start border border-surface-container-high">
<span class="material-symbols-outlined text-primary shrink-0 mt-0.5">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">请填写真实信息，平台将根据任务类型和位置推荐合适的服务者。</p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-lg shadow-[0_6px_16px_rgba(0,0,0,0.1)] active:scale-95 transition-transform flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined filled">publish</span>
                发布任务
            </button>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-surface shadow-[0_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl md:hidden">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all rounded-2xl" href="#">

<span class="material-symbols-outlined" data-icon="apps">apps</span>
<span class="font-label-sm-mobile text-label-sm-mobile mt-1">服务</span>
</a>
<!-- Publish (Active) -->

<span class="material-symbols-outlined filled" data-icon="add_circle">add_circle</span>
<span class="font-label-sm-mobile text-label-sm-mobile mt-1 font-bold">发布</span>
</a>
<!-- Orders (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all rounded-2xl" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-sm-mobile text-label-sm-mobile mt-1">订单</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all rounded-2xl" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm-mobile text-label-sm-mobile mt-1">我的</span>
</a>
</nav>
<script>
        // Simple chip selection interaction
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('button[type="button"].rounded-full');
            chips.forEach(chip => {
                chip.addEventListener('click', function() {
                    // Reset all chips
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
                        c.classList.add('bg-[#F1F5F9]', 'text-on-surface-variant');
                    });
                    // Set active chip
                    this.classList.remove('bg-[#F1F5F9]', 'text-on-surface-variant');
                    this.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
                });
            });
        });
    </script>
